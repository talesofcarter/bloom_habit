<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring pushed to the absolute edge with a thicker stroke -->
  <circle cx="50" cy="50" r="48" stroke="white" stroke-width="4" />
  
  <!-- Inner ring scaled up and thickened so it stands out on tiny screens -->
  <circle cx="50" cy="50" r="33" stroke="#1DB954" stroke-width="16" />
</svg>
